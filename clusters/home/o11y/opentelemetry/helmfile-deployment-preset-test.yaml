repositories:
  - name: open-telemetry
    url: https://open-telemetry.github.io/opentelemetry-helm-charts

releases:
  - chart: open-telemetry/opentelemetry-collector
    name: otel-deployment-preset-test
    version: 0.139.0
    namespace: o11y-collector
    values:
      - mode: deployment

        # Use k8s distribution for presets
        image:
          repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s

        # Enable recommended presets for deployment mode (cluster-level)
        presets:
          clusterMetrics:
            enabled: true
          kubernetesEvents:
            enabled: true

        # Configure exporters for your observability stack
        config:
          exporters:
            otlphttp/loki:
              endpoint: http://loki-gateway.o11y-logs.svc.cluster.local:80/otlp
              tls:
                insecure: true
            otlphttp/mimir:
              endpoint: http://mimir-gateway.o11y-metrics.svc.cluster.local:80/otlp
              tls:
                insecure: true

          service:
            pipelines:
              logs:
                exporters:
                  - otlphttp/loki
              metrics:
                exporters:
                  - otlphttp/mimir

        # Resources similar to your current deployment config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

        # Single replica for cluster-level collection
        replicaCount: 1
