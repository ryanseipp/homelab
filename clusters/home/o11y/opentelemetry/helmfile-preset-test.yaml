repositories:
  - name: open-telemetry
    url: https://open-telemetry.github.io/opentelemetry-helm-charts

releases:
  - chart: open-telemetry/opentelemetry-collector
    name: otel-collector-preset-test
    version: 0.139.0
    namespace: o11y-collector
    values:
      - mode: daemonset

        # Use k8s distribution for presets like logsCollection
        image:
          repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s

        # Enable recommended presets for daemonset mode
        presets:
          logsCollection:
            enabled: true
          hostMetrics:
            enabled: true
          kubernetesAttributes:
            enabled: true
            extractAllPodLabels: true
            extractAllPodAnnotations: true
          kubeletMetrics:
            enabled: true

        # Configure exporters for your observability stack
        config:
          exporters:
            otlphttp/loki:
              endpoint: http://loki-gateway.o11y-logs.svc.cluster.local:80/otlp
              tls:
                insecure: true
            otlphttp/mimir:
              endpoint: http://mimir-gateway.o11y-metrics.svc.cluster.local:80/otlp
              tls:
                insecure: true
            otlp/tempo:
              endpoint: tempo-distributor.o11y-traces.svc.cluster.local:9095
              tls:
                insecure: true

          service:
            pipelines:
              logs:
                exporters:
                  - otlphttp/loki
              metrics:
                exporters:
                  - otlphttp/mimir
              traces:
                exporters:
                  - otlp/tempo

        # Resources similar to your current config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
