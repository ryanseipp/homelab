apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: o11y-metrics
# S3 Storage via Rook Ceph ObjectBucketClaims (auto-generates secrets & configmaps)
# Kafka Topic and User (managed by Strimzi, auto-generates secrets)
