repositories:
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts

releases:
  - chart: prometheus-community/prometheus-node-exporter
    name: node-exporter
    version: 4.47.0
    namespace: o11y-node-exporter
    values:
      # DaemonSet to run on all nodes
      - hostNetwork: true
        hostPID: true

        # Resource limits - homelab micro sizing
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi

        # Service configuration
        service:
          type: ClusterIP
          port: 9100
          targetPort: 9100

        # Security context - needs host access for metrics
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534

        # ServiceMonitor for Prometheus Operator (if used)
        prometheus:
          monitor:
            enabled: true
            interval: 30s

        # Update strategy
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1

        # Tolerations to run on all nodes including control plane
        tolerations:
          - effect: NoSchedule
            operator: Exists

        # Node selector - run on all nodes
        nodeSelector: {}

        # Affinity rules
        affinity: {}
