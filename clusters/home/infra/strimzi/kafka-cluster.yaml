---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: kafka
  namespace: infra-kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: 3
  roles:
    - controller
    - broker
  resources:
    requests:
      cpu: 50m
      memory: 1Gi
    limits:
      memory: 2Gi
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 100Gi
        deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka
  namespace: infra-kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.1.0
    # KRaft metadata version
    metadataVersion: 4.1-IV1
    # Enable JMX Prometheus Exporter for metrics
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      # Auto-create topics disabled for production
      auto.create.topics.enable: false
      # Log retention - adjust based on your needs
      log.retention.hours: 168
    # Resources managed by KafkaNodePool, not here
  entityOperator:
    topicOperator:
      watchedNamespace: "o11y-metrics"
      resources:
        requests:
          memory: 128Mi
          cpu: 10m
        limits:
          memory: 256Mi
    userOperator:
      watchedNamespace: "o11y-metrics"
      resources:
        requests:
          memory: 128Mi
          cpu: 10m
        limits:
          memory: 256Mi
