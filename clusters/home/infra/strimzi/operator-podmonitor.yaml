---
# Official Strimzi PodMonitor for cluster operator
# Source: https://github.com/strimzi/strimzi-kafka-operator/blob/main/examples/metrics/prometheus-install/pod-monitors/cluster-operator-metrics.yaml
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cluster-operator-metrics
  namespace: infra-kafka
  labels:
    app: strimzi
spec:
  selector:
    matchLabels:
      strimzi.io/kind: cluster-operator
  namespaceSelector:
    matchNames:
      - infra-kafka
  podMetricsEndpoints:
    - path: /metrics
      port: http
