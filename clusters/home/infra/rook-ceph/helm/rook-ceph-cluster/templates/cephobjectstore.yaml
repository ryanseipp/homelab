---
# Source: rook-ceph-cluster/templates/cephobjectstore.yaml
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: ceph-bucket
provisioner: infra-storage.ceph.rook.io/bucket
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  objectStoreName: ceph-objectstore
  objectStoreNamespace: infra-storage
  region: us-east-1
---
# Source: rook-ceph-cluster/templates/cephobjectstore.yaml
kind: CephObjectStore
apiVersion: ceph.rook.io/v1
metadata:
  name: ceph-objectstore
  namespace: infra-storage # namespace:cluster
spec:
  dataPool:
    failureDomain: osd
    replicated:
      requireSafeReplicaSize: false
      size: 1
  gateway:
    instances: 1
    port: 80
    priorityClassName: system-cluster-critical
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  metadataPool:
    failureDomain: osd
    replicated:
      requireSafeReplicaSize: false
      size: 1
  preservePoolsOnDelete: true
